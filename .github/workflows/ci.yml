name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" -c requirements/ci-constraints.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q
      - name: Failure diagnostics (temporary)
        if: failure()
        shell: bash
        run: |
          PYTHONIOENCODING=utf-8 python -m pytest -q -rf --tb=short -p no:cacheprovider > /tmp/diag.txt 2>&1 || true
          grep -E "^(FAILED|E )" /tmp/diag.txt | head -25 | while IFS= read -r l; do echo "::error::${l:0:450}"; done
          tail -5 /tmp/diag.txt | while IFS= read -r l; do echo "::warning::${l:0:300}"; done

  package:
    name: package and offline smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/fn
          /tmp/fn/bin/pip install dist/*.whl
          /tmp/fn/bin/fifthnine --version
      - name: Scan samples with networking disabled
        run: |
          for s in orders-service-spring catalog-api-fastapi; do
            sudo unshare --net -- /tmp/fn/bin/fifthnine scan "samples/$s" --format json --facts all --output "/tmp/$s.1.json"
            sudo unshare --net -- /tmp/fn/bin/fifthnine scan "samples/$s" --format json --facts all --output "/tmp/$s.2.json"
            cmp "/tmp/$s.1.json" "/tmp/$s.2.json"
            python -c "import json,sys; d=json.load(open('/tmp/$s.1.json')); assert d['status']=='INCOMPLETE', d['status']; print('$s', d['status'], len(d['inventory']['detected_stacks']), 'stack entries')"
          done
      - name: Exit codes
        run: |
          set +e
          /tmp/fn/bin/fifthnine scan samples/orders-service-spring --mode gate --quiet; test $? -eq 0 || exit 1
          /tmp/fn/bin/fifthnine scan does-not-exist --quiet; test $? -eq 2 || exit 1
          /tmp/fn/bin/fifthnine scan . --format sarif --quiet; test $? -eq 2 || exit 1
          echo "exit codes ok"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

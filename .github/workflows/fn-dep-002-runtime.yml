name: fn-dep-002-runtime

# Runtime ground truth for the preregistered FN-DEP-002 benchmark (benchmarks/m3/fn-dep-002/PROTOCOL.md).
# Builds each case, runs it in a kind cluster and records what the probes actually hit. The FifthNine CLI is not run here
# and stays offline. Results are pushed to the branch benchmark/fn-dep-002-runtime-results so they are kept in git.

on:
  # Runs when the trigger file changes on the benchmark branch (workflow_dispatch needs the file on main).
  push:
    branches: [benchmark/fn-dep-002]
    paths: [benchmarks/m3/fn-dep-002/RUN_RUNTIME]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install pyyaml==6.0.2
      - name: Install kind
        run: |
          if ! curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64; then
            GOBIN="$PWD" go install sigs.k8s.io/kind@v0.27.0
          fi
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --name bench --wait 120s
          kubectl version
      - name: Run shard
        env:
          KIND_CLUSTER: bench
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cases="$(head -n1 benchmarks/m3/fn-dep-002/RUN_RUNTIME)"
          python benchmarks/m3/fn-dep-002/harness/run_runtime.py \
            --cases "$cases" --out out --shard ${{ matrix.shard }}/6 --parallel 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-shard-${{ matrix.shard }}
          path: |
            out/runtime-shard-*.json
            out/logs/

  collect:
    needs: runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Push results
        run: |
          set -e
          dest="runtime-results/${GITHUB_SHA}-run${GITHUB_RUN_ID}"
          mkdir -p "/tmp/$dest"
          cp -r shards/* "/tmp/$dest/"
          git config user.name "fn-dep-002-runtime"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin benchmark/fn-dep-002-runtime-results || true
          if git rev-parse --verify origin/benchmark/fn-dep-002-runtime-results >/dev/null 2>&1; then
            git checkout -B results origin/benchmark/fn-dep-002-runtime-results
          else
            git checkout --orphan results && git rm -rf -q . || true
          fi
          mkdir -p "$dest" && cp -r "/tmp/$dest/"* "$dest/"
          git add runtime-results
          git commit -q -m "Runtime results for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/benchmark/fn-dep-002-runtime-results

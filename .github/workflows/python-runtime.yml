name: python-runtime

# M2-3: loads small FastAPI repositories with the real libraries (FastAPI, pydantic-settings, tenacity, httpx, gunicorn
# --print-config, uvicorn's click parser) and compares what they resolve with what the offline scan reported. Network is used
# only to install the pinned libraries into a separate environment; the scanner runs offline and never imports repository code.

on:
  pull_request:
    paths:
      - "src/fifthnine/resolve/python_app.py"
      - "src/fifthnine/resolve/shellcmd.py"
      - "src/fifthnine/data/defaults/python.v1.yaml"
      - "tests/runtime/python/**"
      - ".github/workflows/python-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the scanner
        run: python -m pip install -e ".[dev]" -c requirements/ci-constraints.txt
      - name: Install the libraries the cases use (separate environment)
        run: |
          python -m venv /tmp/libs
          /tmp/libs/bin/pip install fastapi==0.159.1 uvicorn==0.54.0 uvicorn-worker==0.4.0 gunicorn==26.2.0 httpx==0.28.1 \
            tenacity==9.2.1 pydantic-settings==2.11.0 requests==2.34.2
      - name: Run the cases
        run: |
          set -o pipefail
          python tests/runtime/python/run_cases.py --python /tmp/libs/bin/python --out pyrt-out | tee pyrt-out.txt
      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "### Python runtime comparison"; echo '```'; tail -n 40 pyrt-out.txt; echo '```'; echo "Head: ${{ github.event.pull_request.head.sha }}"; } > comment.md
          gh pr comment "$PR" --body-file comment.md || echo "comment not posted"

name: spring-runtime

# M2-D3: runs small Spring Boot applications and compares what the JVM resolved with what the offline scan reported.
# This is the only workflow that uses the network for anything but installing packages: Maven Central is needed to build the
# fixture application. The scan itself stays offline, and the offline smoke test in ci.yml is unchanged.

on:
  pull_request:
    paths:
      - "src/fifthnine/resolve/spring*.py"
      - "src/fifthnine/extract/spring_config.py"
      - "src/fifthnine/extract/properties.py"
      - "src/fifthnine/resolve/deployment.py"
      - "src/fifthnine/data/defaults/spring-boot.v1.yaml"
      - "tests/runtime/**"
      - ".github/workflows/spring-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: spring-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: runtime comparison
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" -c requirements/ci-constraints.txt
      - name: Tool versions
        run: |
          echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version
          mvn -version
      - name: Run the cases
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          python tests/runtime/spring/run_cases.py --out runtime-out | tee runtime-out.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Spring runtime comparison"
            echo '```'
            tail -n 40 runtime-out.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f runtime-out/report.json ]; then
            python tests/runtime/spring/report_md.py runtime-out/report.json > comment.md
          else
            printf '### Spring runtime comparison\n\nNo report was written; see the workflow run.\n' > comment.md
          fi
          printf '\nHead: %s\n' "${{ github.event.pull_request.head.sha }}" >> comment.md
          gh pr comment "$PR" --body-file comment.md || echo "comment not posted"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: spring-runtime-report
          path: |
            runtime-out/report.json
            runtime-out/logs/
            runtime-out.txt

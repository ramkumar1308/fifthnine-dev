# FifthNine development corpus (A14, M0-D8). PROPOSED in M2-0; not frozen until the CEO approves the list.
# Public repositories used to measure M2 extraction and Condition 4 assessment limits. Repositories are
# never vendored into this repository; benchmarks/dev/corpus/fetch.sh fetches each one at its pinned commit.
# The independent benchmark author excludes every repository listed here from held-out selection.
# Selection criteria, the full candidate pool and exclusion reasons: docs/fifthnine/M2-0.md.
# m1_baseline: `fifthnine scan` from main at d58bcbe on the pinned commit (files considered / parsed;
# detected component versions with support level). "none" means M1 detected no tracked component.
schema: fifthnine.devcorpus/v1
status: proposed
selected_on: "2026-10-22"
selection_doc: docs/fifthnine/M2-0.md
entries:
  # ---------------------------------------------------------------- Spring Boot

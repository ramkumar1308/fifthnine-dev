negative:
  - id: CA-N01
    statement: The effective command of the Deployment container does not contain --reload (RULES.md F13 trap).
    forbid: {kind: k8s.container.effective_command, contains: --reload}
    milestone: M2-1
  - id: CA-N02
    statement: requires-python is not reported as the runtime Python version.
    forbid: {kind: stack.version, subject: component:python, source_path: pyproject.toml}
    milestone: M2-3
  - id: CA-N03
    statement: No fact takes its value from Secret catalog-api-env, which is not in the repository.
    forbid: {value_from: k8s:Secret/_/catalog-api-env}
    milestone: M2-1
  - id: CA-N04
    statement: No route /readyz is invented to match the probe.
    forbid: {kind: fastapi.route, path: /readyz}
    milestone: M2-3
  - id: CA-N05
    statement: No Python HTTP client timeout facts are produced; that check is delegated (M0-D4).
    forbid: {kind_prefix: python.http_client}
    milestone: M2-3

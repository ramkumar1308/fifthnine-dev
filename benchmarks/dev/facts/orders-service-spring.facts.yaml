  - id: SP-N02
    statement: >
      No fact resolved through the out-of-repository Secret has a value: its keys are unknown, so it can only appear
      as override exposure.
    forbid: {input_fact: SP-K11, input_role: value_source, status_not: unresolved}
    milestone: M2-1
  - id: SP-N03
    statement: The base-file exposure list is never reported as the effective prod value.
    forbid: {kind: spring.property, subject: "spring:.:management.endpoints.web.exposure.include", scope: {profile: prod}, value: [health, info, prometheus]}
    milestone: M2-2
  - id: SP-N04

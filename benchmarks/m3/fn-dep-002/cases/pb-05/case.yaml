id: pb-05
boot_version: 3.2.12
dimensions:
  - envfrom-secret-missing
  - env-override-relaxed-binding
  - probe-groups-auto-kubernetes
  - startup-probe
expected: NOT_DETERMINABLE
per_probe:
  startup:
    port: 8080
    path: /actuator/health/liveness
    expected_http: depends_on_runtime_input
  readiness:
    port: 8080
    path: /actuator/health/readiness
    expected_http: depends_on_runtime_input
  liveness:
    port: 8080
    path: /actuator/health/liveness
    expected_http: depends_on_runtime_input
deciding_input: >
  Secret app-runtime-env (referenced by envFrom.secretRef, not optional, not in the repo). Any
  MANAGEMENT_*/SERVER_* keys in it override application.yml through relaxed binding of OS environment
  variables. Without the Secret the container never starts (CreateContainerConfigError).
rationale: >
  From the repository alone the app would serve /actuator/health/{liveness,readiness} on 8080 and the
  probes would pass. The Deployment pulls every key of Secret app-runtime-env into the container
  environment, and OS environment variables have higher precedence than application.yml. A key such as
  MANAGEMENT_SERVER_PORT or SERVER_SERVLET_CONTEXTPATH in that Secret would move actuator away from
  8080 /actuator. The Secret is not in the repository, and the kubelet refuses to start a container
  whose non-optional envFrom Secret is missing, so the outcome is set outside the repo.
citations:
  - "kubernetes v1.31.0 pkg/kubelet/kubelet_pods.go L770-L780 (non-optional envFrom Secret must exist): https://github.com/kubernetes/kubernetes/blob/v1.31.0/pkg/kubelet/kubelet_pods.go#L770-L785"
  - "spring-boot v3.5.16 docs features/external-config.adoc L13-L27 (env vars above config data): https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/features/external-config.adoc#L13-L27"
  - "spring-boot v3.5.16 docs features/external-config.adoc L1037-L1043 (env var name mapping): https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/features/external-config.adoc#L1037-L1043"
  - "spring-boot v3.2.12 ManagementPortType.java L53-L61: https://github.com/spring-projects/spring-boot/blob/v3.2.12/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/web/server/ManagementPortType.java#L53-L61"
runtime_inputs:
  - files: [runtime/secret-a.yaml]
    description: Secret holds only provider URL, API key and log level.
    expected: ALIGNED
    per_probe:
      startup: {port: 8080, path: /actuator/health/liveness, expected_http: 200}
      readiness: {port: 8080, path: /actuator/health/readiness, expected_http: 200}
      liveness: {port: 8080, path: /actuator/health/liveness, expected_http: 200}
  - files: [runtime/secret-b.yaml]
    description: Secret also sets MANAGEMENT_SERVER_PORT=8081, moving actuator to a child context on 8081.
    expected: MISALIGNED
    per_probe:
      startup: {port: 8080, path: /actuator/health/liveness, expected_http: 404}
      readiness: {port: 8080, path: /actuator/health/readiness, expected_http: 404, note: not run while startup fails}
      liveness: {port: 8080, path: /actuator/health/liveness, expected_http: 404, note: not run while startup fails}

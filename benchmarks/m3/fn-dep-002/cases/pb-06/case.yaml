id: pb-06
boot_version: 3.3.13
dimensions:
  - management-port-different
  - management-server-base-path
  - properties-format
  - startup-probe
expected: ALIGNED
per_probe:
  startup:
    port: 9090
    path: /mgmt/actuator/health/liveness
    expected_http: 200
  readiness:
    port: 9090
    path: /mgmt/actuator/health/readiness
    expected_http: 200
  liveness:
    port: 9090
    path: /mgmt/actuator/health/liveness
    expected_http: 200
deciding_input: null
rationale: >
  management.server.port 9090 differs from server.port 8080, so actuator runs in a child context on
  9090. ServletManagementWebServerFactoryCustomizer sets that child server's servlet context path to
  management.server.base-path, here /mgmt, and management.endpoints.web.base-path keeps its /actuator
  default under it. Health groups are auto-enabled on Kubernetes. All probes request
  /mgmt/actuator/health/{liveness,readiness} on 9090, which is exactly where they are served.
citations:
  - "spring-boot v3.3.13 ServletManagementChildContextConfiguration.java L136-L142: https://github.com/spring-projects/spring-boot/blob/v3.3.13/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/web/servlet/ServletManagementChildContextConfiguration.java#L136-L142"
  - "spring-boot v3.3.13 ManagementServerProperties.java L55 (basePath): https://github.com/spring-projects/spring-boot/blob/v3.3.13/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/web/server/ManagementServerProperties.java#L55"
  - "spring-boot v3.5.16 docs actuator/monitoring.adoc L32-L33 (base-path relative to management.server.base-path on a separate port): https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/actuator/monitoring.adoc#L32-L33"
  - "spring-boot v3.3.13 AvailabilityProbesAutoConfiguration.java L75-L92: https://github.com/spring-projects/spring-boot/blob/v3.3.13/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/availability/AvailabilityProbesAutoConfiguration.java#L75-L92"
runtime_inputs: []

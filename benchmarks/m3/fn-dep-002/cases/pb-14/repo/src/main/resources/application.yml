spring:
  application:
    name: search-indexer

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: false
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

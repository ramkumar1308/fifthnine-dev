id: pb-28
boot_version: 3.5.16
dimensions:
  - profile-specific-file
  - spring-profiles-active-deployment
  - env-override-relaxed-binding
  - management-port-different
expected: ALIGNED
per_probe:
  readiness:
    port: 8081
    path: /actuator/health/readiness
    expected_http: 200
  liveness:
    port: 8081
    path: /actuator/health/liveness
    expected_http: 200
deciding_input: null
rationale: >
  SPRING_PROFILES_ACTIVE=prod loads application-prod.yml, which sets management.server.port 9090. The
  Deployment also sets MANAGEMENT_SERVER_PORT=8081. OS environment variables rank above all config data,
  including profile-specific files, so management.server.port resolves to 8081 and the management server
  listens there. Probes target 8081 with the standard group paths and get 200. A reader who stops at the
  profile file would expect 9090 and call this misaligned.
citations:
  - "spring-boot v3.5.16 docs features/external-config.adoc L13-L35 (env vars above config data; profile files above base files): https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/features/external-config.adoc#L13-L35"
  - "spring-boot v3.5.16 docs features/external-config.adoc L1037-L1043: https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/features/external-config.adoc#L1037-L1043"
  - "spring-boot v3.5.16 ManagementPortType.java L53-L61: https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/web/server/ManagementPortType.java#L53-L61"
runtime_inputs: []

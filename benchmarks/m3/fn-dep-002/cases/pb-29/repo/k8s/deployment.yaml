apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: fifthnine-bench/pb-29:1
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app-settings
          env:
            - name: MANAGEMENT_SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-ports
                  key: management_port
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /ops/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ops/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ops/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3

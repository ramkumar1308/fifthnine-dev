spring:
  application:
    name: calendar-sync

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

management:
  server:
    port: 8081
  endpoint:
    health:
      show-details: never

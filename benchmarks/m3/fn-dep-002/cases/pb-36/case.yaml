id: pb-36
boot_version: 3.5.16
dimensions:
  - envfrom-configmap-optional-missing
  - env-override-relaxed-binding
  - named-probe-port
  - startup-probe
expected: NOT_DETERMINABLE
per_probe:
  startup:
    port: 8080
    path: /actuator/health/liveness
    expected_http: depends_on_runtime_input
  readiness:
    port: 8080
    path: /actuator/health/readiness
    expected_http: depends_on_runtime_input
  liveness:
    port: 8080
    path: /actuator/health/liveness
    expected_http: depends_on_runtime_input
deciding_input: >
  ConfigMap lead-scoring-overrides (envFrom.configMapRef with optional: true, not in the repo). If it is
  absent the pod starts with repo config only and the probes pass; if production supplies it, any
  MANAGEMENT_*/SERVER_* key in it can move actuator.
rationale: >
  With repo config only, actuator shares port 8080 at /actuator and the groups are auto-enabled, so the
  probes would pass. The Deployment also imports ConfigMap lead-scoring-overrides as environment
  variables. Because it is marked optional the kubelet starts the container even when it is missing,
  which is why a repo-only run looks healthy. The name says it exists to override settings in the
  deployed environment, and its keys outrank application.yml. Its contents are not in the repo, so the
  production outcome is not decided by the repository.
citations:
  - "kubernetes v1.31.0 pkg/kubelet/kubelet_pods.go L740-L760 (optional envFrom ConfigMap ignored when missing): https://github.com/kubernetes/kubernetes/blob/v1.31.0/pkg/kubelet/kubelet_pods.go#L740-L760"
  - "spring-boot v3.5.16 docs features/external-config.adoc L13-L27: https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-docs/src/docs/antora/modules/reference/pages/features/external-config.adoc#L13-L27"
  - "spring-boot v3.5.16 ManagementPortType.java L53-L61: https://github.com/spring-projects/spring-boot/blob/v3.5.16/spring-boot-project/spring-boot-actuator-autoconfigure/src/main/java/org/springframework/boot/actuate/autoconfigure/web/server/ManagementPortType.java#L53-L61"
runtime_inputs:
  - files: [runtime/configmap-a.yaml]
    description: Overrides only logging and a batch size.
    expected: ALIGNED
    per_probe:
      startup: {port: 8080, path: /actuator/health/liveness, expected_http: 200}
      readiness: {port: 8080, path: /actuator/health/readiness, expected_http: 200}
      liveness: {port: 8080, path: /actuator/health/liveness, expected_http: 200}
  - files: [runtime/configmap-b.yaml]
    description: Sets MANAGEMENT_SERVER_PORT=9090, moving actuator off 8080.
    expected: MISALIGNED
    per_probe:
      startup: {port: 8080, path: /actuator/health/liveness, expected_http: 404}
      readiness: {port: 8080, path: /actuator/health/readiness, expected_http: 404, note: not run while startup fails}
      liveness: {port: 8080, path: /actuator/health/liveness, expected_http: 404, note: not run while startup fails}

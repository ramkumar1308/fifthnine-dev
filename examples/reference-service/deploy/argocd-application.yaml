# Argo CD keeps production in sync with deploy/overlays/production on the main branch.
# A merge to main is a release; reverting the merge is a rollback (see RUNBOOK.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/reference-service.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: reference-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

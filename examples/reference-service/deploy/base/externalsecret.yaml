# The upstream token lives in the platform secret store. External Secrets Operator
# copies it into the Kubernetes Secret that the Deployment references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reference-service-upstream
  labels:
    app.kubernetes.io/name: reference-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: reference-service-upstream
  data:
    - secretKey: token
      remoteRef:
        key: reference-service/upstream-token

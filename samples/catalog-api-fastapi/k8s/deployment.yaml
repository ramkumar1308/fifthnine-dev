apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app: catalog-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.acme.example/catalog-api:2.3.1
          command: ["gunicorn"]
          args:
            - "app.main:app"
            - "--worker-class=uvicorn_worker.UvicornWorker"
            - "--workers=4"
            - "--bind=0.0.0.0:8000"
            - "--graceful-timeout=60"
            - "--timeout=90"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: catalog-api-env
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3

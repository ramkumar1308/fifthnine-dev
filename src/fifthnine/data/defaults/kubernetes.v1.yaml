# Kubernetes API defaults used when a manifest leaves a field unset (CEO decision M2-0-D3).
# Each entry is cited at the newest maintained release and was checked identical at the latest patch of every
# release in verified_at (benchmarks/dev/facts/verify_upstream.py re-checks the cited lines). The cluster version and
# its admission configuration are not in the repository: a mutating webhook or LimitRange can still change a value at
# admission, so these are documented defaults, never observed production values.

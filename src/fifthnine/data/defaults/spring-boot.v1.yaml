# Spring Boot defaults used when a setting is absent from every source the repository shows (CEO decisions M2-D1, M2-R1, M2-R2).
# One reviewed release per supported minor (3.2 to 3.5; Boot 4 is deferred, M2-0-D6). Every entry cites a file and line in the tagged
# source and the anchor text on that line; benchmarks/dev/facts/verify_upstream.py re-reads the tagged source and checks each one.
# The cited release is the latest patch of the minor on 2026-10-21. An entry applies to the other patch releases of the same minor
# on the stated assumption that a default does not change inside a minor; `component.spring-framework` is exact-patch only.
# `verified_at` lists the releases of the minor at which verify_upstream.py found each cited anchor text in the cited file (first, middle
# and latest patch); the cited line is checked at the cited release only. An anchor match shows the declaration is unchanged, not that
# every code path leaves the value untouched.
# These are documented defaults, never observed production values: application code, the classpath and auto-configuration that
# the repository does not show can still change the effective behaviour.

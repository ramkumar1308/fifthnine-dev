# FifthNine support matrix (D9). Validated by src/fifthnine/schema/support_v1.py.
# A version is "tested" only when it appears under tested_versions with runtime_fixtures evidence covering
# every rule that depends on the component. Everything else is untested, whatever review it has had.
# As of M0 no version of any component is tested. Approved ranges are targets, not support claims.
version: 1
as_of: "2026-10-21"
tested_definition: >
  The exact version ran in CI with the runtime fixtures of every rule that depends on it, and those
  fixtures passed. For frameworks this means the sample application was built and started on that version.

components:
  - id: spring-boot
    component: spring-boot
    approved_range: ">=3.2.0,<3.6.0"
    tested_versions: []
    other_evidence:
      - {version: "3.2.12", kind: source_review, detail: "ServerProperties, LifecycleProperties, probes, ManagementPortType, config locations, ClientHttpRequestFactories", rules: [FN-DEP-003, FN-DEP-002, FN-RES-001, FN-CFG-001], recorded: "2026-10-21"}
      - {version: "3.3.13", kind: source_review, detail: "ServerProperties shutdown default, LifecycleProperties, ClientHttpRequestFactories, no HttpClientProperties", rules: [FN-DEP-003, FN-RES-001], recorded: "2026-10-21"}
      - {version: "3.4.13", kind: source_review, detail: "GRACEFUL default, HttpClientProperties, ClientHttpRequestFactoryBuilder.detect, Access model", rules: [FN-DEP-003, FN-DEP-002, FN-RES-001], recorded: "2026-10-21"}
      - {version: "3.5.16", kind: source_review, detail: "as 3.4 plus HttpReactiveClientProperties and Cloud Foundry probe auto-enable", rules: [FN-DEP-003, FN-DEP-002, FN-RES-001, FN-CFG-001], recorded: "2026-10-21"}
    limits:
      - "Spring Boot 2.x and 4.x unsupported"
      - "Sample application not built or started in M0 (Maven Central unreachable)"
      - "Management path edge cases RULES.md R4 and R6 need runtime fixtures"
  - id: spring-framework
    component: spring-framework
    approved_range: ">=6.1.0,<6.3.0 (as managed by Spring Boot 3.2-3.5)"
    tested_versions: []
    other_evidence:
      - {version: "6.1.15", kind: source_review, detail: "HttpAccessor default factory, SimpleClientHttpRequestFactory timeouts, DefaultRestClientBuilder", rules: [FN-RES-001], recorded: "2026-10-21"}
      - {version: "6.2.19", kind: source_review, detail: "same files; ReactorNetty added to RestClient detection", rules: [FN-RES-001], recorded: "2026-10-21"}
    limits: []
  - id: java
    component: java
    approved_range: "17, 21"
    tested_versions: []
    other_evidence: []
    limits: ["Kotlin sources not parsed"]
  - id: resilience4j
    component: resilience4j
    approved_range: ">=2.0.0,<3.0.0 (intended; not part of E5)"
    tested_versions: []
    other_evidence:
